<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#00A868">
<title>Tá Pago</title>
<meta name="description" content="Agenda de cobranças para autônomos: anote quem deve, mande o Pix pelo WhatsApp e marque quando pagou.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--verde:#00A868;--verde-fundo:#0A7355;--laranja:#FF7A1A;--fundo:#F2F5F3;--texto:#13211B;
--texto2:#5C6B63;--linha:#E2E8E4;--trilho:#E7ECE8;--zap:#25D366}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--fundo);color:var(--texto);font-size:17px}
header{background:var(--verde);color:#fff;padding:20px 20px 60px;border-radius:0 0 28px 28px}
.topo{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:26px;font-weight:800}.logo span{color:#FFE27A}
.perfil{display:flex;align-items:center;gap:9px;background:none;border:none;color:#fff;cursor:pointer;padding:4px;border-radius:99px}
.perfil:active{background:rgba(255,255,255,.15)}
.avatar{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;overflow:hidden;flex:0 0 30px}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.engr{width:22px;height:22px;color:#fff;flex:0 0 22px}
.conta{display:flex;align-items:center;gap:12px;padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid #EEF1EF}
.contaFoto{width:42px;height:42px;border-radius:50%;background:#E6F6EE;color:var(--verde);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;overflow:hidden;flex:0 0 42px}
.contaFoto img{width:100%;height:100%;object-fit:cover;display:block}
.contaTexto{min-width:0}
.contaTexto b{display:block;font-size:16px}
.contaTexto span{display:block;color:#667;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resumo{max-width:560px;margin:-44px auto 0;padding:0 16px}
.total{background:#fff;border-radius:20px;padding:18px;box-shadow:0 4px 14px #0001}
.total small{color:var(--texto2);display:block}
.total b{display:block;font-size:32px;color:var(--verde-fundo);letter-spacing:-.5px;margin:2px 0}
main{max-width:560px;margin:auto;padding:16px 16px 110px}
.abas{display:flex;background:var(--trilho);border-radius:12px;padding:3px;margin-bottom:14px}
.abas button{flex:1;border:none;background:none;padding:9px;border-radius:9px;font-size:15px;font-weight:600;color:var(--texto2);cursor:pointer}
.abas .ativa{background:#fff;color:var(--texto);box-shadow:0 1px 3px #0000001f}
.card{background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:10px;border:1px solid var(--linha)}
.linha{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nome{font-weight:700}.valor{font-weight:800;font-size:19px;white-space:nowrap}
.serv{color:var(--texto2);font-size:14px;margin:3px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:6px;white-space:nowrap}
.atrasado{background:#FEE4E2;color:#B42318}
.avencer{background:#FEF0C7;color:#B54708}
.pago{background:#D1FADF;color:#05603A}
.aberto{background:var(--trilho);color:var(--texto2)}
.acoes{display:flex;gap:8px;margin-top:12px}
.acoes button{border:none;border-radius:10px;padding:10px;font-size:15px;font-weight:600;cursor:pointer}
.zap{flex:1.4;background:var(--zap);color:#fff;display:flex;align-items:center;justify-content:center;gap:7px}
.zap svg{width:17px;height:17px;flex:0 0 17px}
.ok{flex:1;background:#fff;color:var(--texto);border:1px solid #CFD9D3!important}
.del{flex:0 0 40px;background:none;color:var(--texto2)}
.del:active,.ok:active{background:var(--trilho)}
.fab{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--laranja);color:#fff;border:none;border-radius:99px;padding:15px 30px;font-size:17px;font-weight:700;box-shadow:0 4px 12px #00000026;cursor:pointer}
.fab:active{transform:translateX(-50%) scale(.97)}
.vazio{text-align:center;color:#889;padding:30px}
.visto{display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--linha);font-size:12px;color:var(--texto2)}
.bolinha{width:7px;height:7px;border-radius:50%;background:#C2CDC7;flex:0 0 7px}
.bolinha.vista{background:var(--verde)}
.rodape{text-align:center;color:#889;font-size:13px;padding:10px 0 0}
.rodape a{color:#889}
.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:20}
.modal.aberto{display:flex}
.painel{background:#fff;width:100%;max-width:560px;margin:auto;border-radius:24px 24px 0 0;padding:20px}
.painel h2{margin-top:0}
.painel input{width:100%;font-size:17px;padding:13px;border:1px solid #DDE;border-radius:12px;margin-bottom:10px}
.painel .principal{width:100%;background:var(--verde);color:#fff;border:none;border-radius:14px;padding:15px;font-size:18px;font-weight:800;cursor:pointer}
.painel .fechar{width:100%;background:none;border:none;color:#667;padding:12px;font-size:16px;cursor:pointer}
.dica{color:#667;font-size:14px;margin:-4px 0 12px}
.campo-valor{position:relative}
.campo-valor .moeda{position:absolute;left:14px;top:14px;font-size:17px;color:#667;pointer-events:none}
.campo-valor input{padding-left:44px}
.login{position:fixed;inset:0;background:var(--verde);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:30;text-align:center;padding:24px}
.login .logo{font-size:44px}
.login p{margin:0 0 14px;opacity:.9}
.login input{width:100%;max-width:320px;font-size:17px;padding:14px;border:none;border-radius:14px;text-align:center}
.login button{background:#fff;color:#1C2B24;border:none;border-radius:14px;padding:15px 30px;font-size:18px;font-weight:700;cursor:pointer}
.login small{opacity:.85;max-width:320px;line-height:1.4}
.login .caixa{width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;gap:10px}
.btgoogle{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;color:#1C2B24;border:none;border-radius:14px;padding:15px;font-size:17px;font-weight:700;cursor:pointer}
.btgoogle svg{width:20px;height:20px;flex:0 0 20px}
.ou{display:flex;align-items:center;gap:10px;width:100%;opacity:.6;font-size:13px;margin:2px 0}
.ou::before,.ou::after{content:"";flex:1;height:1px;background:#fff;opacity:.4}
.login .link{background:none;border:none;color:#fff;text-decoration:underline;font-size:15px;font-weight:400;padding:4px;cursor:pointer}
.login .porEmail{display:none;flex-direction:column;align-items:center;gap:10px;width:100%}
.login .porEmail.aberto{display:flex}
.rodapeLogin{position:absolute;bottom:18px;font-size:12px;opacity:.75;text-align:center;line-height:1.6}
.rodapeLogin a{color:#fff}
</style>
</head>
<body>

<div id="login" class="login">
  <div class="logo">Tá Pago<span>.</span></div>
  <p>Mandou, tá pago.</p>
  <div class="caixa">
    <button class="btgoogle" onclick="entrarGoogle()">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Entrar com Google
    </button>
    <div class="ou">ou</div>
    <button class="link" id="btMostraEmail" onclick="mostrarEmail()">Entrar com meu e-mail</button>
    <div class="porEmail" id="porEmail">
      <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="seu@email.com">
      <button onclick="entrar()">Receber link de acesso</button>
    </div>
    <small id="aviso">Entre com um toque. Seus dados ficam salvos na sua conta.</small>
  </div>
  <div class="rodapeLogin"><a href="termos.html">Termos de uso</a> · <a href="privacidade.html">Privacidade</a></div>
</div>

<header>
  <div class="topo">
    <div class="logo">Tá Pago<span>.</span></div>
    <button class="perfil" onclick="abrir('mDados')" title="Minha conta" aria-label="Minha conta">
      <span class="avatar" id="avatar"></span>
      <svg class="engr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</header>

<div class="resumo">
  <div class="total">
    <small>Quem me deve, no total</small>
    <b id="total">R$ 0,00</b>
    <small id="sub"></small>
  </div>
</div>

<main>
  <div class="abas">
    <button id="aDeve" class="ativa" onclick="aba(false)">Quem me deve</button>
    <button id="aPago" onclick="aba(true)">Tá pago</button>
  </div>
  <div id="lista"></div>
  <p class="rodape"><a href="privacidade.html">Privacidade</a></p>
</main>

<button class="fab" onclick="abrir('mNova')">+ Cobrar</button>

<div class="modal" id="mNova"><div class="painel">
  <h2>Nova cobrança</h2>
  <input id="cliente" placeholder="Nome do cliente">
  <input id="servico" placeholder="O que foi feito? (ex.: corte de cabelo)">
  <div class="campo-valor"><span class="moeda">R$</span><input id="valor" type="text" inputmode="numeric" autocomplete="off" placeholder="0,00"></div>
  <input id="venc" type="date">
  <button class="principal" onclick="adicionar()">Salvar cobrança</button>
  <button class="fechar" onclick="fechar()">Cancelar</button>
</div></div>

<div class="modal" id="mDados"><div class="painel">
  <h2>Minha conta</h2>
  <div class="conta" id="conta"></div>
  <input id="chave" placeholder="Chave Pix (telefone: +5511999999999)">
  <p class="dica">É para a sua chave que o dinheiro vai cair.</p>
  <input id="meuNome" placeholder="Seu nome">
  <input id="cidade" placeholder="Sua cidade">
  <button class="principal" onclick="salvarDados()">Salvar</button>
  <button class="fechar" onclick="fechar()">Fechar</button>
  <button class="fechar" onclick="sair()">Sair da conta</button>
</div></div>

<script>
const SUPABASE_URL = 'https://xfkiaicwzyfeatsxbskz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_LRIB_DIwGRHMqukblUxx_w_1SdKkoEA';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let dados = {}, cobs = [], verPagas = false, user = null;
const $ = id => document.getElementById(id);
const brl = v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const dataBR = d => d ? d.split('-').reverse().join('/') : '';
const dataCurta = d => d ? d.split('-').reverse().slice(0, 2).join('/') : '';
const erro = e => { if (e) { alert('Erro: ' + e.message); return true; } };

// Login por link mágico no e-mail
async function iniciar() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('login').style.display = 'flex'; return; }
  user = session.user;
  $('login').style.display = 'none';
  mostrarConta();
  await carregar();
}
function entrarGoogle() {
  sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: location.origin + location.pathname }
  });
}
function mostrarEmail() {
  $('porEmail').classList.add('aberto');
  $('btMostraEmail').style.display = 'none';
  $('email').focus();
}
async function entrar() {
  const email = $('email').value.trim();
  if (!email) return alert('Digite seu e-mail.');
  const { error } = await sb.auth.signInWithOtp({
    email, options: { emailRedirectTo: location.origin + location.pathname }
  });
  if (erro(error)) return;
  $('aviso').textContent = 'Enviamos um link para ' + email + '. Abra o e-mail no mesmo celular e toque no link.';
}
async function sair() { await sb.auth.signOut(); location.reload(); }
sb.auth.onAuthStateChange((ev, session) => { if (session && !user) iniciar(); });

// Leitura do banco
async function carregar() {
  const { data: p } = await sb.from('perfis').select('*').maybeSingle();
  dados = p ? { chave: p.chave, meuNome: p.nome, cidade: p.cidade } : {};
  const { data: c, error } = await sb.from('cobrancas').select('*').order('criado_em');
  if (erro(error)) return;
  cobs = (c || []).map(x => ({ ...x, valor: Number(x.valor) }));
  render();
  if (!dados.chave) abrir('mDados');
}

const esc = t => String(t == null ? '' : t)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

function mostrarConta() {
  if (!user) return;
  const m = user.user_metadata || {};
  const nome = m.full_name || m.name || '';
  const foto = m.avatar_url || m.picture || '';
  const email = user.email || '';
  const inicial = esc((nome || email).trim().charAt(0).toUpperCase() || '?');
  const img = foto ? `<img src="${esc(foto)}" alt="" referrerpolicy="no-referrer">` : inicial;
  $('avatar').innerHTML = img;
  $('conta').innerHTML = `<div class="contaFoto">${img}</div>
    <div class="contaTexto">${nome ? `<b>${esc(nome)}</b>` : ''}<span>${esc(email)}</span></div>`;
}

function abrir(id) {
  if (id === 'mDados') ['chave','meuNome','cidade'].forEach(k => $(k).value = dados[k] || '');
  $(id).classList.add('aberto');
}
function fechar() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('aberto')); }
function aba(p) {
  verPagas = p;
  $('aDeve').classList.toggle('ativa', !p);
  $('aPago').classList.toggle('ativa', p);
  render();
}

// Gravação no banco
async function salvarDados() {
  dados = { chave: $('chave').value.trim(), meuNome: $('meuNome').value.trim(), cidade: $('cidade').value.trim() };
  const { error } = await sb.from('perfis').upsert({
    user_id: user.id, chave: dados.chave, nome: dados.meuNome, cidade: dados.cidade
  });
  if (!erro(error)) fechar();
}
$('valor').addEventListener('input', e => {
  const d = e.target.value.replace(/\D/g, '').slice(0, 11);
  e.target.value = d ? (Number(d) / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '';
});
function valorDigitado() {
  const d = $('valor').value.replace(/\D/g, '');
  return d ? Number(d) / 100 : 0;
}

async function adicionar() {
  const valor = valorDigitado();
  if (!$('cliente').value.trim() || !valor) return alert('Preencha o cliente e o valor.');
  const nova = {
    cliente: $('cliente').value.trim(),
    servico: $('servico').value.trim(),
    valor,
    venc: $('venc').value || null
  };
  const { data, error } = await sb.from('cobrancas').insert(nova).select().single();
  if (erro(error)) return;
  cobs.push({ ...data, valor: Number(data.valor) });
  ['cliente','servico','valor','venc'].forEach(k => $(k).value = '');
  fechar(); aba(false);
}
async function alternar(id) {
  const c = cobs.find(c => c.id === id);
  const pago = !c.pago, pago_em = pago ? new Date().toISOString().slice(0, 10) : null;
  const { error } = await sb.from('cobrancas').update({ pago, pago_em }).eq('id', id);
  if (erro(error)) return;
  c.pago = pago; c.pago_em = pago_em; render();
}
async function excluir(id) {
  if (!confirm('Excluir esta cobrança?')) return;
  const { error } = await sb.from('cobrancas').delete().eq('id', id);
  if (erro(error)) return;
  cobs = cobs.filter(c => c.id !== id); render();
}

// WhatsApp: manda um link que abre a pagina de pagamento
function b64(s) {
  return btoa(String.fromCharCode(...new TextEncoder().encode(s)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function linkPagamento(c) {
  const d = { k: dados.chave, n: dados.meuNome || 'RECEBEDOR', c: dados.cidade || 'BRASIL',
              v: c.valor, s: c.servico || '', d: c.venc || '', t: c.token };
  const base = location.origin + location.pathname.replace(/[^/]*$/, '');
  return base + 'pagar.html#' + b64(JSON.stringify(d));
}
function enviar(id) {
  const c = cobs.find(c => c.id === id);
  if (!dados.chave) { alert('Primeiro cadastre seu Pix.'); return abrir('mDados'); }
  const msg = `Olá, ${c.cliente}! Tudo bem? 😊\nSegue a cobrança de ${c.servico || 'serviço'}: *${brl(c.valor)}*`
    + (c.venc ? `, com vencimento em ${dataBR(c.venc)}` : '')
    + `.\n\nÉ só abrir o link abaixo e tocar em "Copiar código Pix", ou ler o QR Code:\n${linkPagamento(c)}\n\nObrigado!`;
  window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
}

// Tela
function render() {
  const hoje = new Date().toISOString().slice(0, 10);
  const deve = cobs.filter(c => !c.pago);
  const atras = deve.filter(c => c.venc && c.venc < hoje);
  $('total').textContent = brl(deve.reduce((s, c) => s + c.valor, 0));
  $('sub').textContent = deve.length
    ? `${deve.length} cobrança(s)` + (atras.length ? ` · ${atras.length} atrasada(s)` : '')
    : 'Ninguém te deve. Tá tudo pago! 🎉';
  const lista = cobs.filter(c => c.pago === verPagas)
    .sort((a, b) => verPagas ? b.id - a.id : (a.venc || '9').localeCompare(b.venc || '9'));
  $('lista').innerHTML = lista.map(c => {
    const tag = c.pago ? ['pago', 'Tá pago']
      : (c.venc && c.venc < hoje) ? ['atrasado', 'Atrasado']
      : c.venc ? ['avencer', 'Vence ' + dataCurta(c.venc)]
      : ['aberto', 'Em aberto'];
    const visto = c.pago ? ''
      : c.aberto_em ? `<div class="visto"><span class="bolinha vista"></span>Cliente abriu a cobrança ${quando(c.aberto_em)}</div>`
      : `<div class="visto"><span class="bolinha"></span>Ainda não abriu</div>`;
    return `<div class="card">
      <div class="linha"><span class="nome">${esc(c.cliente)}</span><span class="valor">${brl(c.valor)}</span></div>
      <div class="linha"><span class="serv">${esc(c.servico || '')}</span><span class="tag ${tag[0]}">${tag[1]}</span></div>
      <div class="acoes">
        ${c.pago ? '' : `<button class="zap" onclick="enviar(${c.id})"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5.05-1.32A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.18-1.14l-.3-.18-3.1.81.83-3.02-.2-.31A8.2 8.2 0 1 1 12 20.2z"/><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.96-.94 1.16-.17.2-.35.22-.64.07-.3-.15-1.25-.46-2.39-1.47-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.06 2.88 1.21 3.08c.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.69.63.71.22 1.36.19 1.87.12.57-.09 1.76-.72 2.01-1.41.25-.7.25-1.29.17-1.42-.07-.13-.27-.2-.57-.35z"/></svg>WhatsApp</button>`}
        <button class="ok" onclick="alternar(${c.id})">${c.pago ? 'Desfazer' : '✓ Tá pago'}</button>
        <button class="del" onclick="excluir(${c.id})">🗑</button>
      </div>${visto}</div>`;
  }).join('') || `<div class="vazio">${verPagas ? 'Nenhum pagamento ainda.' : 'Toque em "+ Cobrar" para começar.'}</div>`;
}

// Releitura silenciosa: ao voltar para o app e de minuto em minuto
let atualizando = false;
async function atualizar() {
  if (atualizando || !user || document.hidden) return;
  atualizando = true;
  try {
    const { data, error } = await sb.from('cobrancas').select('*').order('criado_em');
    if (!error && data) {
      cobs = data.map(x => ({ ...x, valor: Number(x.valor) }));
      render();
    }
  } catch (e) {
    // falha de rede nao incomoda o usuario; tenta de novo no proximo ciclo
  } finally {
    atualizando = false;
  }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) atualizar(); });
window.addEventListener('focus', atualizar);
setInterval(atualizar, 60000);

function quando(iso) {
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if (min < 1) return 'agora';
  if (min < 60) return `há ${min} min`;
  if (min < 1440) return `há ${Math.round(min / 60)} h`;
  const dias = Math.round(min / 1440);
  return dias === 1 ? 'ontem' : `há ${dias} dias`;
}

// Pix estático no padrão BR Code do Banco Central
function limpar(s, max) {
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().slice(0, max);
}
function campo(id, v) { return id + String(v.length).padStart(2, '0') + v; }
function crc16(s) {
  let c = 0xFFFF;
  for (let i = 0; i < s.length; i++) {
    c ^= s.charCodeAt(i) << 8;
    for (let k = 0; k < 8; k++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF;
  }
  return c.toString(16).toUpperCase().padStart(4, '0');
}
function pix(chave, nome, cidade, valor) {
  const conta = campo('00', 'br.gov.bcb.pix') + campo('01', chave);
  const p = campo('00', '01') + campo('26', conta) + campo('52', '0000') + campo('53', '986')
    + campo('54', valor.toFixed(2)) + campo('58', 'BR') + campo('59', limpar(nome, 25))
    + campo('60', limpar(cidade, 15)) + campo('62', campo('05', '***')) + '6304';
  return p + crc16(p);
}

iniciar();
